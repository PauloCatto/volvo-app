<header class="header">
  <div class="container">
    <a routerLink="" class="logo" aria-label="Volvo Home">
      <img src="assets/images/logo-volvo-group.svg" alt="Volvo Logo" />
    </a>

    <nav class="nav" id="nav-menu">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/cars" routerLinkActive="active">Cars</a>
      <a routerLink="/trucks" routerLinkActive="active">Trucks</a>
      <a routerLink="/bus" routerLinkActive="active">Bus</a>

      <button
        class="icon-btn"
        aria-label="Toggle dark mode"
        (click)="toggleDarkMode()"
        title="Toggle dark mode"
      >
        <span class="material-icons">dark_mode</span>
        <span class="isDarkMode">{{ isDarkMode ? "Dark" : "Light" }}</span>
      </button>

      <button
        class="icon-btn"
        aria-label="Favorites"
        (click)="toggleFavorites()"
        title="Favorites"
      >
        <span class="material-icons">favorite_border</span>
        <span class="isDarkMode">favorites</span>
      </button>
    </nav>
  </div>
</header>
