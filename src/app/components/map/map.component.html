<p class="text-fields">
  Here are all our Volvo dealership locations across Brazil. Browse the map,
  explore each location, and find the dealership nearest to you for a
  personalized Volvo experience.
</p>

<div class="map-container">
  <google-map
    height="400px"
    width="100%"
    [center]="center"
    [zoom]="zoom"
    (mapClick)="closeInfo()"
    (mapInitialized)="mapReady($event)"
  >
    <!-- Current User Location Marker -->
    <map-marker
      *ngIf="currentPosition"
      [position]="currentPosition"
      [icon]="markerIcon"
      title="Your Location"
    >
    </map-marker>

    <!-- Store Location Markers -->
    <map-marker
      *ngFor="let store of stores"
      [position]="{ lat: store.lat, lng: store.lng }"
      [title]="store.name"
      (mapClick)="openInfo(store, markerRef)"
      #markerRef="mapMarker"
    >
    </map-marker>

    <!-- Info Window -->
    <map-info-window>
      <div>
        <h3>{{ selectedStore?.name }}</h3>
        <button (click)="onMarkerClick(selectedStore!)">Trace Route</button>
      </div>
    </map-info-window>
  </google-map>
</div>
