<section class="trucks-intro">
  <h2>Discover Our Range of Trucks</h2>
  <p>
    Built for performance, endurance, and efficiency. Explore our lineup of
    Volvo trucks designed to handle the toughest journeys with power and
    reliability.
  </p>
</section>

<section class="trucks-container">
  <div class="truck-card" *ngFor="let truck of trucks">
    <div class="truck-image">
      <img [src]="truck.imageUrl" [alt]="truck.modelName" />
    </div>
    <div class="truck-content">
      <div class="truck-header">
        <span class="truck-type">{{ truck.type }}</span>
        <span class="truck-badge">{{ truck.engineType }}</span>
        <button
          class="material-icons favorite-icon"
          [ngClass]="{ active: truck.favorite }"
          (click)="toggleFavorite(truck)"
        >
          {{ truck.favorite ? "favorite" : "favorite_border" }}
        </button>
      </div>
      <h3 class="truck-title">{{ truck.modelName }}</h3>
      <div class="truck-payload">Payload: {{ truck.payload }}</div>
      <button class="btn">View Details</button>
    </div>
  </div>
</section>
