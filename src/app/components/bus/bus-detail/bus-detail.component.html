<section class="buses-intro">
  <h2 [ngClass]="{ 'white-text': isDarkMode }">Explore Our Bus Lineup</h2>
  <p [ngClass]="{ 'white-text': isDarkMode }">
    Discover Volvo buses built for comfort, efficiency, and capacity. From urban
    electrics to long-distance intercity models, each bus is designed for a
    smooth and sustainable ride.
  </p>
</section>

<section class="buses-container">
  <div class="bus-card" *ngFor="let bus of buses">
    <div class="bus-image">
      <img [src]="bus.imageUrl" [alt]="bus.modelName" />
    </div>
    <div class="bus-content">
      <div class="bus-header">
        <span class="bus-type">{{ bus.type }}</span>
        <span class="bus-badge">{{ bus.engineType }}</span>
        <button
          class="material-icons favorite-icon"
          [ngClass]="{ active: bus.favorite }"
          (click)="toggleFavorite(bus)"
        >
          {{ bus.favorite ? "favorite" : "favorite_border" }}
        </button>
      </div>
      <h3 class="bus-title" [ngClass]="{ 'white-text': isDarkMode }">
        {{ bus.modelName }}
      </h3>
      <div class="bus-capacity" [ngClass]="{ 'white-text': isDarkMode }">
        Capacity: {{ bus.capacity }}
      </div>
      <button class="btn">View Details</button>
    </div>
  </div>
</section>
