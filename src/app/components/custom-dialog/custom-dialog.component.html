<div class="volvo-dialog">
  <div class="dialog-header">
    <div class="header-content">
      <h2 mat-dialog-title>{{ data.title || "Volvo Information" }}</h2>
      <p *ngIf="data.subTitle" class="subtitle">{{ data.subTitle }}</p>
    </div>
    <button mat-icon-button (click)="close()" class="close-btn" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-body">
    <div class="message-container">
      <p>{{ data.message }}</p>
    </div>
  </div>

  <div mat-dialog-actions align="end" class="dialog-footer">
    <button mat-button (click)="close()" class="primary-btn">Dismiss</button>
  </div>
</div>
